<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pix API Test</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, sans-serif;

        background: #f4f4f5;
      }

      .card {
        width: 100%;
        max-width: 400px;

        padding: 24px;

        background: white;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
      }

      h1 {
        margin-top: 0;
      }

      label {
        display: block;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px;

        border: 1px solid #d4d4d8;
        border-radius: 8px;

        font-size: 16px;
      }

      button {
        width: 100%;

        margin-top: 16px;
        padding: 12px;

        border: 0;
        border-radius: 8px;

        background: #18181b;
        color: white;

        cursor: pointer;
      }

      #response {
        margin-top: 20px;
        padding: 12px;

        border-radius: 8px;

        background: #f4f4f5;

        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>Teste Pix</h1>

      <form id="pix-form">
        <label for="amount"> Valor </label>

        <input
          id="amount"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="50.00"
          required
        />

        <button type="submit">Criar pagamento</button>
      </form>

      <div id="response">Aguardando teste...</div>
    </main>

    <script>
      const form = document.querySelector("#pix-form");

      const responseElement = document.querySelector("#response");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const amount = Number(document.querySelector("#amount").value);

        responseElement.textContent = "Enviando requisição...";

        try {
          const response = await fetch("/payments/pix", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              amount,
              payer: {
                name: "Testando via interface",
                email: "test@example.com",
                identification: {
                  type: "CPF",
                  number: "52998224725",
                },
              },
            }),
          });

          const data = await response.json();
          console.log("data", data);

          responseElement.innerHTML = `
            <div><strong>Status:</strong> ${data.status}</div>
            <div><strong>Valor:</strong> R$ ${data.amount}</div>

            <img
                src="${data.qrCode}"
                alt="QR Code Pix"
                width="250"
            >

            <div>
                <strong>Pix copia e cola:</strong>
                <div>${data.pixCode}</div>
            </div>
            `;
        } catch (error) {
          console.error(error);

          responseElement.textContent = "Erro ao comunicar com a API.";
        }
      });
    </script>
  </body>
</html>
