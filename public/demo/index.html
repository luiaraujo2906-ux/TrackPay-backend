<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pix Demo</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="http://localhost:3000/socket.io/socket.io.js" defer></script>
    <script src="./index.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Pix Demo logo">
          <span class="brand-mark">P</span>
          <span>Pix Demo</span>
        </div>

        <button id="reset-button" class="ghost-button" type="button">
          Limpar
        </button>
      </header>

      <main class="dashboard">
        <section class="panel payment-panel">
          <p class="eyebrow">Teste real de pagamento</p>
          <h1>Criar cobrança Pix</h1>

          <form id="payment-form">
            <label class="field" for="amount">
              <span>Valor</span>
              <input
                id="amount"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="50.00"
                value="25.00"
                required
              />
            </label>

            <button id="submit-button" class="primary-button" type="submit">
              Gerar cobrança
            </button>
          </form>

          <div id="status-box" class="status-box idle" aria-live="polite">
            <strong>Status:</strong>
            <span id="status-label">Aguardando ação</span>
          </div>
        </section>

        <section class="panel result-panel" aria-live="polite">
          <div id="empty-state" class="empty-state">
            <div class="empty-icon">◌</div>
            <p>Crie um pagamento para gerar o QR Code e o código Pix.</p>
          </div>

          <div id="payment-result" class="payment-result hidden">
            <div class="result-header">
              <div>
                <h2>Pagamento</h2>
              </div>

              <span id="payment-status" class="status-pill pending"
                >Pendente</span
              >
            </div>

            <div class="amount-line">
              <span>Valor</span>
              <strong id="payment-amount">R$ 0,00</strong>
            </div>

            <div class="meta-grid">
              <div class="grid-full">
                <span>ID</span>
                <strong id="payment-id">-</strong>
              </div>
            </div>

            <div class="qr-wrap">
              <img id="qr-image" src="" alt="QR Code da cobrança Pix" />
            </div>

            <div class="pix-box">
              <div class="pix-header">
                <span>Código Pix</span>
                <button id="copy-button" class="secondary-button" type="button">
                  Copiar
                </button>
              </div>

              <pre id="pix-code">-</pre>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
